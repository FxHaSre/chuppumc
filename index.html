<title>Word Parts – medical terminology made easy</title>

<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:clamp(2.6rem,12vw,4.4rem);font-weight:800;margin:.2em 0 0;letter-spacing:-.03em;line-height:1}
h1 span{display:inline-block;animation:snap 1.1s cubic-bezier(.2,.9,.3,1.15) both}
h1 .a{color:var(--p);--d:-70px}h1 .b{color:var(--r);--d:0px;animation-delay:.1s}h1 .c{color:var(--s);--d:70px;animation-delay:.2s}
@keyframes snap{from{transform:translateX(var(--d)) scale(.7);opacity:0;letter-spacing:.3em}to{transform:none;opacity:1}}
.sub{color:var(--mut);margin:.6em 0 1.2em;max-width:34em}
nav{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px;position:sticky;top:8px;z-index:5}
nav button{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
nav button,.pill{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.slots{display:grid;gap:10px}
@media(min-width:560px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:10px 12px}
.slot label{font-weight:600;font-size:.9rem;color:var(--c)}
select{width:100%;font:inherit;margin-top:4px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.P{--c:var(--p)}.R{--c:var(--r)}.S{--c:var(--s)}
.out{margin:22px 0 8px;font-size:clamp(2.2rem,11vw,3.8rem);font-weight:800;letter-spacing:-.02em;word-break:break-word;min-height:1.2em}
.out i{font-style:normal;display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.out .P{color:var(--p)}.out .R{color:var(--r)}.out .S{color:var(--s)}
@keyframes pop{from{transform:translateY(.4em) scale(.6);opacity:0}}
.legend{display:grid;gap:6px;margin:0 0 18px}
.legend div{border-left:6px solid var(--c);padding:4px 10px;background:var(--card);border-radius:0 10px 10px 0}
.legend b{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.pill{border:1.5px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px}
.chip:hover,.pill:hover{border-color:var(--ink)}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:1rem;margin:22px 0 8px;color:var(--mut);font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=search]{flex:1 1 180px;font:inherit;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.prog{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{perspective:800px;height:118px;cursor:pointer}
.in{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:10px 12px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);overflow:auto}
.fb{transform:rotateY(180deg)}
.fa b{font-size:1.5rem;color:var(--c);word-break:break-word}
.fb small{display:block;color:var(--mut);margin-top:4px}
.star{position:absolute;top:4px;right:6px;border:0;background:none;font-size:1.3rem;color:var(--mut);z-index:2}
.star[aria-pressed=true]{color:#e8a600}
.q{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:16px}
.q .big{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:800;color:var(--c);margin:4px 0 12px;word-break:break-word}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stats{display:flex;gap:16px;margin-bottom:12px;color:var(--mut)}
.stats b{color:var(--ink);font-size:1.3rem}
.next{margin-top:12px;padding:10px 18px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600}
.fb2{margin-top:10px;color:var(--mut)}
footer{margin-top:36px;color:var(--mut);font-size:.85rem}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<h1 aria-label="peri card itis"><span class="a">peri</span><span class="b">card</span><span class="c">itis</span></h1>
<p class="sub">Every medical term is built from small pieces: prefix + root + suffix. Learn the pieces and you can decode words you have never seen.</p>
<nav role="tablist"><button role="tab" aria-selected="true" data-t="build">Build</button><button role="tab" aria-selected="false" data-t="learn">Learn</button><button role="tab" aria-selected="false" data-t="quiz">Quiz</button></nav>

<section id="build">
<div class="slots">
<div class="slot P"><label for="sp">Prefix (before)</label><select id="sp"></select></div>
<div class="slot R"><label for="sr">Root (body part)</label><select id="sr"></select></div>
<div class="slot S"><label for="ss">Suffix (ending)</label><select id="ss"></select></div>
</div>
<div class="out" id="out" aria-live="polite"></div>
<div class="legend" id="leg"></div>
<h2>Try a real term</h2>
<div class="chips" id="chips"></div>
</section>

<section id="learn" hidden>
<div class="bar" id="lf"></div>
<div class="bar"><input type="search" id="q" placeholder="Search a part or meaning…" aria-label="Search"></div>
<div class="prog"><i id="pg"></i></div><div class="sub" id="pt" style="margin:0 0 12px"></div>
<div class="grid" id="grid"></div>
</section>

<section id="quiz" hidden>
<div class="bar" id="qf"></div>
<div class="stats"><div><b id="sc">0</b> correct</div><div><b id="st">0</b> streak</div><div><b id="bs">0</b> best</div></div>
<div class="q" id="qb"></div>
</section>
<footer>Study aid for medical coding. Always confirm terms against your textbook or the official code books.</footer>

for(const k in extra){
 const existing=new Set(raw[k].trim().split('\n').map(x=>x.split('|')[0].toLowerCase()));
 const add=extra[k].trim().split('\n').filter(x=>!existing.has(x.split('|')[0].toLowerCase()));
 raw[k]+='\n'+add.join('\n');
}

const NAME={p:'Prefix',r:'Root',s:'Suffix'},D={};
for(const k in raw)D[k]=raw[k].trim().split('\n').map(l=>{const[f,m,e]=l.split('|');return{f,m,e,k}});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const vars=x=>x.f.split('/').map(s=>s.replace(/\(.*?\)/g,'').replace(/-/g,'').trim());
const vow=/^[aeiouy]/;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* tabs */
$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['build','learn','quiz'].forEach(t=>$('#'+t).hidden=t!==b.dataset.t);
  if(b.dataset.t==='quiz'&&!$('#qb').innerHTML)nextQ();
});

/* build */
const sel={p:$('#sp'),r:$('#sr'),s:$('#ss')};
for(const k in sel){sel[k].innerHTML='<option value="-1">(none)</option>'+D[k].map((x,i)=>`<option value="${i}">${esc(x.f)} – ${esc(x.m)}</option>`).join('');sel[k].onchange=render}
const pick=k=>+sel[k].value<0?null:D[k][+sel[k].value];
function render(){
  const p=pick('p'),r=pick('r'),s=pick('s');
  const sS=s?vars(s)[0]:'',rS=r?vars(r)[0]:'';
  const nxt=(rS||sS)[0]||'';
  let pS='';if(p){const v=vars(p);pS=v.length>1&&vow.test(nxt)?v[v.length-1]:v[0]}
  const o=r&&s&&!vow.test(sS)?'o':'';
  const segs=[];
  if(p)segs.push(['P',pS]);if(r)segs.push(['R',rS+o]);if(s)segs.push(['S',sS]);
  $('#out').innerHTML=segs.length?segs.map(([c,t])=>[...t].map((ch,i)=>`<i class="${c}" style="animation-delay:${i*30}ms">${ch}</i>`).join('')).join(''):'<span style="color:var(--mut);font-weight:400">Pick pieces above</span>';
  $('#leg').innerHTML=[[p,'P'],[r,'R'],[s,'S']].filter(a=>a[0]).map(([x,c])=>`<div class="${c}"><b>${esc(x.f)}</b> means ${esc(x.m)}</div>`).join('');
}
const find=(k,b)=>D[k].findIndex(x=>vars(x).includes(b));
const real=[['peri','cardi','itis'],['','nephr','ectomy'],['brady','cardi','ia'],['poly','neur','itis'],['','hemat','oma'],['','cholecyst','ectomy'],['hypo','glyc','emia'],['endo','','scopy'],['','arthr','algia'],['','gastr','enter'],['dys','','phagia'],['','cardi','logy']].filter(a=>a[2]!=='enter');
$('#chips').innerHTML=real.map((a,i)=>`<button class="chip" data-i="${i}">${a[0]}${a[1]}${a[1]&&a[2]&&!vow.test(a[2])?'o':''}${a[2]}</button>`).join('');
$$('.chip').forEach(c=>c.onclick=()=>{const a=real[c.dataset.i];['p','r','s'].forEach((k,j)=>sel[k].value=a[j]?find(k,a[j]):-1);render()});
sel.p.value=find('p','peri');sel.r.value=find('r','cardi');sel.s.value=find('s','itis');render();

/* learn */
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem('wp-known')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('wp-known',JSON.stringify([...known]))}catch(e){}};
let ft='all';
const filt=(id,cb)=>{
  $(id).innerHTML=[['all','All'],['p','Prefixes'],['r','Roots'],['s','Suffixes']].map(([k,n])=>`<button class="pill" data-k="${k}" aria-pressed="${k==='all'}">${n}</button>`).join('');
  $$(id+' .pill').forEach(b=>b.onclick=()=>{$$(id+' .pill').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.k)});
};
const all=[...D.p,...D.r,...D.s],key=x=>x.k+':'+x.f;
function grid(){
  const q=$('#q').value.toLowerCase();
  const L=all.filter(x=>(ft==='all'||x.k===ft)&&(x.f+x.m+x.e).toLowerCase().includes(q));
  $('#grid').innerHTML=L.map(x=>`<div class="card ${x.k.toUpperCase()}" data-key="${esc(key(x))}"><div class="in"><div class="fa"><small>${NAME[x.k]}</small><br><b>${esc(x.f)}</b></div><div class="fb"><b>${esc(x.m)}</b><small>e.g. ${esc(x.e)}</small></div></div><button class="star" aria-label="Mark as known" aria-pressed="${known.has(key(x))}">★</button></div>`).join('')||'<p class="sub">Nothing found.</p>';
  $$('.card').forEach(c=>{
    c.onclick=()=>c.classList.toggle('f');
    c.querySelector('.star').onclick=e=>{e.stopPropagation();const k=c.dataset.key;known.has(k)?known.delete(k):known.add(k);e.target.setAttribute('aria-pressed',known.has(k));save();prog()};
  });
  prog();
}
function prog(){const n=all.filter(x=>known.has(key(x))).length;$('#pg').style.width=n/all.length*100+'%';$('#pt').textContent=`${n} of ${all.length} marked as known. Tap a card to flip it, tap ★ when you know it.`}
filt('#lf',k=>{ft=k;grid()});$('#q').oninput=grid;grid();

/* quiz */
let qt='all',score=0,streak=0,best=0;
try{best=+localStorage.getItem('wp-best')||0}catch(e){}
$('#bs').textContent=best;
filt('#qf',k=>{qt=k;nextQ()});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function nextQ(){
  const pool=qt==='all'?all:D[qt];
  const a=pool[Math.floor(Math.random()*pool.length)];
  const same=(qt==='all'?D[a.k]:pool).filter(x=>x!==a&&x.m!==a.m);
  const opts=shuf([a,...shuf(same).slice(0,3)]);
  const rev=Math.random()<.35;
  $('#qb').className='q '+a.k.toUpperCase();
  $('#qb').innerHTML=`<small>${NAME[a.k]}: ${rev?'which one means':'what does it mean?'}</small><div class="big">${esc(rev?a.m:a.f)}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(rev?o.f:o.m)}</button>`).join('')}</div><div id="fd"></div>`;
  $$('.opt').forEach(b=>b.onclick=()=>{
    const ok=opts[b.dataset.i]===a;
    $$('.opt').forEach((x,i)=>{x.disabled=true;if(opts[i]===a)x.classList.add('ok')});
    if(ok){score++;streak++;if(streak>best){best=streak;try{localStorage.setItem('wp-best',best)}catch(e){}}}
    else{b.classList.add('no');streak=0}
    $('#sc').textContent=score;$('#st').textContent=streak;$('#bs').textContent=best;
    $('#fd').innerHTML=`<p class="fb2">${esc(a.f)} = ${esc(a.m)}. Example: <b>${esc(a.e)}</b></p><button class="next" id="nx">Next</button>`;
    $('#nx').focus();$('#nx').onclick=nextQ;
  });
}
</script></body></html>
