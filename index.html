button{font:inherit;color:inherit;cursor:pointer}
nav button,.pill{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600}

<p class="sub">Every medical term is built from small pieces: prefix + root + suffix. Learn the pieces and you can decode words you have never seen.</p>
<nav role="tablist"><button aria-selected="true" data-t="build" role="tab">Build</button><button aria-selected="false" data-t="learn" role="tab">Learn</button><button aria-selected="false" data-t="quiz" role="tab">Quiz</button></nav>
<section id="build">
<div class="slots">
<div class="slot P"><label for="sp">Prefix (before)</label><select id="sp"></select></div>
<div class="slot R"><label for="sr">Root (body part)</label><select id="sr"></select></div>
<div class="slot S"><label for="ss">Suffix (ending)</label><select id="ss"></select></div>
</div>
<div aria-live="polite" class="out" id="out"></div>
<div class="legend" id="leg"></div>
<h2>Try a real term</h2>
<div class="chips" id="chips"></div>
</section>
<section hidden="" id="learn">
<div class="bar" id="lf"></div>
<div class="learn-actions"><button id="studyQuiz" type="button">Quiz this section →</button></div>
<div class="bar"><input aria-label="Search" id="q" placeholder="Search a part or meaning…" type="search"/></div>
<div class="prog"><i id="pg"></i></div><div class="sub" id="pt" style="margin:0 0 12px"></div>
<div class="grid" id="grid"></div>
</section>
<section hidden="" id="quiz">
<div class="bar" id="qf"></div>
<div class="stats"><div><b id="sc">0</b> correct</div><div><b id="wc">0</b> wrong</div><button class="chip" id="resetQuiz" type="button">Reset score</button></div>
<div class="q" id="qb"></div>
</section>
<footer>Study aid for medical coding. Always confirm terms against your textbook or the official code books.</footer>

const pick=k=>+sel[k].value<0?null:D[k][+sel[k].value];
function render(){
  const p=pick('p'),r=pick('r'),s=pick('s');
  const sS=s?vars(s)[0]:'',rS=r?vars(r)[0]:'';
  const nxt=(rS||sS)[0]||'';
  let pS='';if(p){const v=vars(p);pS=v.length>1&&vow.test(nxt)?v[v.length-1]:v[0]}
  const o=r&&s&&!vow.test(sS)?'o':'';
  const segs=[];
  if(p)segs.push(['P',pS]);if(r)segs.push(['R',rS+o]);if(s)segs.push(['S',sS]);
  $('#out').innerHTML=segs.length?segs.map(([c,t])=>[...t].map((ch,i)=>`<i class="${c}" style="animation-delay:${i*30}ms">${ch}</i>`).join('')).join(''):'<span style="color:var(--mut);font-weight:400">Pick pieces above</span>';
  $('#leg').innerHTML=[[p,'P'],[r,'R'],[s,'S']].filter(a=>a[0]).map(([x,c])=>`<div class="${c}"><b>${esc(x.f)}</b> means ${esc(x.m)}</div>`).join('');
}

": "വെള്ളം", "example": "Hydrophobe: വെള്ളത്തെ അകറ്റുന്ന / കലരാത്ത വസ്തു"}, "hyster(o)": {"meaning": "ഗർഭാശയം", "example": "Hysterectomy: ഗർഭാശയം നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "kerat(o)": {"meaning": "കോർണിയ / ത്വക്കിന്റെ കട്ടിയുള്ള പാളി", "example": "Keratoscope: കോർണിയ/ത്വക്കുമായി ബന്ധപ്പെട്ട പരിശോധനാ ഉപകരണം"}, "laryng(o)": {"meaning": "ശബ്ദപ്പെട്ടി (Larynx)", "example": "Laryngitis: ശബ്ദപ്പെട്ടിയിലെ വീക്കം"}, "leuk(o)": {"meaning": "വെളുപ്പ്", "example": "Leukocyte: വെളുത്ത രക്താണു"}, "mamm(o)/mast(o)": {"meaning": "സ്തനം", "example": "Mammogram: സ്തനത്തിന്റെ X-ray ചിത്രം"}, "melan(o)": {"meaning": "കറുപ്പ് നിറം", "example": "Melanin: ത്വക്കിന് നിറം നൽകുന്ന പിഗ്മെന്റ്"}, "mening(o)": {"meaning": "മസ്തിഷ്കത്തെയും സുഷുമ്നയെയും മൂടുന്ന ആവരണങ്ങൾ", "example": "Meningitis: ഈ ആവരണങ്ങളിലെ വീക്കം"}, "metr(o)": {"meaning": "ഗർഭാശയം", "example": "Metrorrhagia: മാസവാരത്തിന് ഇടയിൽ ഉണ്ടാകുന്ന ഗർഭാശയ രക്തസ്രാവം"}, "my(o)": {"meaning": "പേശി", "example": "Myoblast: പേശിയായി വളരുന്ന പ്രാഥമിക കോശം"}, "myel(o)": {"meaning": "അസ്ഥിമജ്ജ", "example": "Myeloblast: അസ്ഥിമജ്ജയിലെ പ്രാഥമിക രക്തകോശം"}, "nas(o)/rhin(o)": {"meaning": "മൂക്ക്", "example": "Rhinoplasty: മൂക്കിന്റെ രൂപം മാറ്റുന്ന ശസ്ത്രക്രിയ"}, "necr(o)": {"meaning": "മരണം / കോശനാശം", "example": "Necrosis: ശരീരകലകളിലെ കോശങ്ങൾ നശിക്കുന്ന അവസ്ഥ"}, "nephr(o)": {"meaning": "വൃക്ക", "example": "Nephrology: വൃക്കയെക്കുറിച്ചുള്ള പഠനവും ചികിത്സയും"}, "neur(o)": {"meaning": "നാഡി", "example": "Neuropathy: നാഡികൾക്ക് ഉണ്ടാകുന്ന തകരാർ"}, "ocul(o)/ophthalm(o)": {"meaning": "കണ്ണ്", "example": "Ophthalmology: കണ്ണിനെക്കുറിച്ചുള്ള പഠനവും ചികിത്സയും"}, "onych(o)": {"meaning": "നഖം", "example": "Onychomycosis: നഖത്തിലെ ഫംഗസ് ബാധ"}, "oophor(o)": {"meaning": "അണ്ഡാശയം", "example": "Oophorectomy: അണ്ഡാശയം നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "or(o)/stomat(o)": {"meaning": "വായ", "example": "Stomatitis: വായ്ക്കുള്ളിലെ വീക്കം"}, "orchi(o)": {"meaning": "വൃഷണം", "example": "Orchiectomy: വൃഷണം നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "oste(o)": {"meaning": "അസ്ഥി", "example": "Osteoporosis: അസ്ഥികളുടെ സാന്ദ്രത കുറയുന്ന അവസ്ഥ"}, "path(o)": {"meaning": "രോഗം", "example": "Pathology: രോഗങ്ങളെക്കുറിച്ചുള്ള പഠനം"}, "pharyng(o)": {"meaning": "തൊണ്ട (Pharynx)", "example": "Pharyngitis: തൊണ്ടയിലെ വീക്കം"}, "phleb(o)": {"meaning": "സിര", "example": "Phlebotomy: രക്തം എടുക്കുന്നതിനായി സിരയിൽ സൂചി ഇടുന്ന നടപടി"}, "pneum(o)": {"meaning": "ശ്വാസകോശം / വായു", "example": "Pneumonia: ശ്വാസകോശത്തിലെ അണുബാധയും വീക്കവും"}, "pulmon(o)": {"meaning": "ശ്വാസകോശം", "example": "Pulmonary: ശ്വാസകോശവുമായി ബന്ധപ്പെട്ടത്"}, "proct(o)": {"meaning": "മലദ്വാരം / മലാശയം", "example": "Proctology: മലദ്വാരത്തെയും മലാശയത്തെയും സംബന്ധിച്ച പഠനവും ചികിത്സയും"}, "psych(o)": {"meaning": "മനസ്സ്", "example": "Psychiatry: മാനസികാരോഗ്യത്തെക്കുറിച്ചുള്ള പഠനവും ചികിത്സയും"}, "pyel(o)": {"meaning": "വൃക്കയിലെ മൂത്രശേഖരണ ഭാഗം", "example": "Pyelonephritis: വൃക്കയിലെ അണുബാധയും വീക്കവും"}, "rect(o)": {"meaning": "മലാശയം", "example": "Rectocele: മലാശയഭിത്തി യോനിയുടെ ഭാഗത്തേക്ക് തള്ളിവരുന്ന അവസ്ഥ"}, "ren(o)": {"meaning": "വൃക്ക", "example": "Renal: വൃക്കയുമായി ബന്ധപ്പെട്ടത്"}, "salping(o)": {"meaning": "ഫലോപ്പിയൻ ട്യൂബ്", "example": "Salpingectomy: ഫലോപ്പിയൻ ട്യൂബ് നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "sarc(o)": {"meaning": "മാംസകല / പേശി", "example": "Sarcoma: ബന്ധകലകളിൽ നിന്നുണ്ടാകുന്ന കാൻസർ"}, "scler(o)": {"meaning": "കഠിനം", "example": "Atherosclerosis: ധമനികളിൽ കൊഴുപ്പ് അടിഞ്ഞ് കട്ടിയാകുന്ന അവസ്ഥ"}, "splen(o)": {"meaning": "പ്ലീഹ", "example": "Splenectomy: പ്ലീഹ നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "spondyl(o)": {"meaning": "കശേരുക / നട്ടെല്ല്", "example": "Spondylitis: കശേരുക്കളിലെ വീക്കം"}, "steth(o)": {"meaning": "നെഞ്ച്", "example": "Stethoscope: നെഞ്ചിലെ ശബ്ദങ്ങൾ കേൾക്കാനുള്ള ഉപകരണം"}, "thorac(o)": {"meaning": "നെഞ്ച്", "example": "Thoracotomy: നെഞ്ച് തുറന്ന് ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "thromb(o)": {"meaning": "രക്തക്കട്ട", "example": "Thrombosis: രക്തക്കുഴലിൽ രക്തക്കട്ട രൂപപ്പെടുന്ന അവസ്ഥ"}, "thyr(o)": {"meaning": "തൈറോയ്ഡ് ഗ്രന്ഥി", "example": "Thyroidectomy: തൈറോയ്ഡ് ഗ്രന്ഥി നീക്കം ചെയ്യുന്ന ശസ്ത്രക്രിയ"}, "trache(o)": {"meaning": "ശ്വാസനാളം", "example": "Tracheotomy: ശ്വാസനാളത്തിൽ മുറിവുണ്ടാക്കുന്ന ശസ്ത്രക്രിയ"}, "trich(o)": {"meaning": "മുടി", "example": "Trichotomy: മുടി മുറിക്കുന്ന നടപടി"}, "ur(o)": {"meaning": "മൂത്രം / മൂത്രവ്യവസ്ഥ", "example": "Urology: മൂത്രവ്യവസ്ഥയെക്കുറിച്ചുള്ള പഠനവും ചികിത്സയും"}, "vas(o)": {"meaning": "രക്തക്കുഴൽ / നാളി", "example": "Vasoconstriction: രക്തക്കുഴൽ ചുരുങ്ങൽ"}, "ven(o)": {"meaning": "സിര", "example": "Venospasm: സിരയിലെ പേശി ചുരുങ്ങൽ"}, "vesic(o)": {"meaning": "മൂത്രാശയം", "example": "Vesica: മൂത്രാശയം"}, "xanth(o)": {"meaning": "മഞ്ഞ നിറം", "example": "Xanthopathy: മഞ്ഞ നിറവുമായി ബന്ധപ്പെട്ട രോഗാവസ്ഥ"}, "cyan(o)": {"meaning": "നീല നിറം", "example": "Cyanosis: രക്തത്തിലെ ഓക്സിജൻ കുറയുമ്പോൾ ചർമ്മം നീലനിറമാകുന്ന അവസ്ഥ"}, "chlor(o)": {"meaning": "പച്ച നിറം", "example": "Chlorophyll: സസ്യങ്ങൾക്ക് പച്ചനിറം നൽകുന്ന വർണ്ണകം"}};

function grid(){
  const q=$('#q').value.toLowerCase();
  const L=all.filter(x=>(ft==='all'||x.k===ft)&&(x.f+x.m+x.e).toLowerCase().includes(q));
  const normRoot=s=>s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z]/g,'');
  const rootInfo=x=>{
    if(x.k!=='r')return null;
    if(rootMalayalam[x.f])return rootMalayalam[x.f];
    const parts=x.f.split(/[\/,]/).map(v=>normRoot(v));
    return Object.entries(rootMalayalam).find(([k])=>{
      const aliases=k.split(/[\/,]/).map(v=>normRoot(v));
      return parts.some(a=>a && aliases.some(b=>b && (a===b || a.startsWith(b) || b.startsWith(a))));
    })?.[1]||null;
  };
  $('#grid').innerHTML=L.map(x=>{const info=rootInfo(x);return `<div class="card ${x.k.toUpperCase()}" data-key="${esc(key(x))}"><div class="in"><div class="fa">${x.k==='r'?art(rootArt[x.f]||rootSpot(x)):'<div style="height:12px"></div>'}<div class="fa-title"><small>${NAME[x.k]}</small><br><b>${esc(x.f)}</b></div></div><div class="fb"><b>${esc(x.m)}</b><small>e.g. ${esc(x.e)}</small>${x.k==='r'&&info?.example?`<small>ഉദാഹരണത്തിന്റെ അർത്ഥം: ${esc(info.example)}</small>`:''}</div></div><button class="star" aria-label="Mark as known" aria-pressed="${known.has(key(x))}">★</button></div>`}).join('')||'<p class="sub">Nothing found.</p>';
  $$('.card').forEach(c=>{
    c.onclick=e=>{if(!e.target.closest('button'))c.classList.toggle('f')};
    c.querySelector('.star').onclick=e=>{e.stopPropagation();const k=c.dataset.key;known.has(k)?known.delete(k):known.add(k);e.target.setAttribute('aria-pressed',known.has(k));save();prog()};
  });
  prog();
}
function prog(){const n=all.filter(x=>known.has(key(x))).length;$('#pg').style.width=n/all.length*100+'%';$('#pt').textContent=`${n} of ${all.length} marked as known. Tap a card to flip it, tap ★ when you know it.`}
filt('#lf',k=>{ft=k;grid()});$('#q').oninput=grid;grid();
$('#studyQuiz').onclick=()=>{qt=ft;$$('#qf .pill').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===qt));$$('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==='quiz'));['build','learn','quiz'].forEach(t=>$('#'+t).hidden=t!=='quiz');nextQ()};

/* quiz */
let qt='all',score=0,wrong=0;
$('#resetQuiz').onclick=()=>{score=0;wrong=0;$('#sc').textContent=0;$('#wc').textContent=0;nextQ()};
filt('#qf',k=>{qt=k;nextQ()});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function nextQ(){
  const pool=(qt==='all'?all:(D[qt]||[])).filter(x=>x&&x.f);
  if(!pool.length){$('#qb').innerHTML='<p>No terms found in this section.</p>';return;}
  const a=pool[Math.floor(Math.random()*pool.length)];
  const distractorPool=(qt==='all'?all:(D[a.k]||pool)).filter(x=>x!==a && x.m!==a.m && x.f!==a.f);
  const distractors=shuf(distractorPool).slice(0,3);
  // Always show four choices; if one category has too few distinct meanings, use other terms as fallback.
  if(distractors.length<3){
    for(const x of shuf(all)) if(x!==a && !distractors.includes(x) && x.f!==a.f && x.m!==a.m){distractors.push(x);if(distractors.length===3)break;}
  }
  const opts=shuf([a,...distractors]);
  const rev=Math.random()<.35;
  $('#qb').className='q '+a.k.toUpperCase();
  $('#qb').innerHTML=`<small>${NAME[a.k]}: ${rev?'which one means':'what does it mean?'}</small><div class="big">${esc(rev?a.m:a.f)}</div><div class="opts">${opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}">${esc(rev?o.f:o.m)}</button>`).join('')}</div><div id="fd" aria-live="polite"></div>`;
  $$('#qb .opt').forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    const chosen=opts[Number(b.dataset.i)];
    const ok=chosen===a;
    $$('#qb .opt').forEach((x,i)=>{x.disabled=true;if(opts[i]===a)x.classList.add('ok')});
    if(ok)score++;else{wrong++;b.classList.add('no')}
    $('#sc').textContent=score;$('#wc').textContent=wrong;
    $('#fd').innerHTML=`<p class="fb2">${esc(a.f)} = ${esc(a.m)}. Example: <b>${esc(a.e||'—')}</b></p><button class="next" id="nx" type="button">Next</button>`;
    $('#nx').onclick=nextQ;
  });
}
</script></body></html>
